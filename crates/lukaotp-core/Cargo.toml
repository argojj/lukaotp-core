[package]
name = "lukaotp-core"
version = "0.3.2"
edition = "2021"
description = "Local TOTP and encrypted-vault core for LukaOTP"
license = "MPL-2.0"
publish = false

[dependencies]
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
data-encoding = "2"
aes-gcm = "0.10"
argon2 = "0.5"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["derive"] }
secrecy = { version = "0.10", features = ["serde"] }
rand = "0.8"
thiserror = "2"
url = "2"
percent-encoding = "2"

[dev-dependencies]
tempfile = "3"
