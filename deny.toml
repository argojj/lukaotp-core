[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "wasm32-unknown-unknown",
]
all-features = false

[advisories]
ignore = []

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "BlueOak-1.0.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = true
registries = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-workspace = true
deny = [
  { crate = "ed25519-dalek@<2.0.0", reason = "legacy signing-oracle lineage is outside Suite 1" },
  { crate = "rust-crypto", reason = "unmaintained legacy cryptography is outside Suite 1" },
  { crate = "sodiumoxide", reason = "unreviewed alternate cryptographic facade is outside Suite 1" },
]
skip = []
skip-tree = []

[[bans.features]]
crate = "hpke@0.14.0"
allow = ["alloc", "chacha", "hkdfsha2", "x25519"]
exact = true

[[bans.features]]
crate = "ed25519-dalek@3.0.0"
allow = ["alloc", "fast", "zeroize"]
exact = true

[[bans.features]]
crate = "x25519-dalek@3.0.0"
allow = ["static_secrets", "zeroize"]
exact = true

[[bans.features]]
crate = "chacha20poly1305@0.11.0"
allow = ["alloc", "zeroize"]
exact = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
